<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09051b">
<title>EDC KOREA 2026 · My Timetable</title>
<style>
:root{--bg:#09051b;--panel:#121026;--panel2:#181531;--line:#30294a;--text:#f7f4ff;--muted:#aaa4c2;--pink:#ff3ba7;--cyan:#55efff;--hour:90px;--stage-gap:6px}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 50% -20%,#32135c 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{color:inherit;cursor:pointer}
.app{max-width:1500px;margin:auto;padding:18px 18px 44px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:950;letter-spacing:-.08em;background:linear-gradient(135deg,#ff3ba7,#6d49ff);box-shadow:0 0 28px #c22b9c55}
.title{font-size:16px;font-weight:900;letter-spacing:.08em}
.sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.12em}
.top-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn,.day,.filter,.stage-filter{border:1px solid var(--line);background:#17132b;border-radius:11px;padding:9px 12px;font-weight:750}
.btn:hover,.day:hover,.filter:hover,.stage-filter:hover{border-color:#70508d}
.btn.primary{background:linear-gradient(110deg,#a92a96,#6448dd);border-color:transparent}
.days{display:flex;gap:8px;margin-bottom:10px}
.day{min-width:120px;text-align:left}
.day b{display:block;font-size:14px}
.day small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.day.active{border-color:var(--pink);background:#55245f;box-shadow:0 0 20px #e52b9b2b}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.search{flex:1;min-width:230px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#100d20}
.search input{width:100%;border:0;outline:0;background:transparent;color:white;padding:11px 0}
.filter.active{border-color:var(--pink);color:#ff9bd6;background:#29152f}
.stage-filters{display:flex;gap:6px;overflow:auto;padding:2px 0 11px;scrollbar-width:thin}
.stage-filter{white-space:nowrap;font-size:11px;padding:8px 11px}
.stage-filter.active{border-color:#ff4ab0;background:#51236e}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:11px 2px 10px;color:var(--muted);font-size:12px}
.status b{color:white;font-size:18px}

/* screenshot-style festival timetable */
.schedule-shell{border:1px solid #2a2340;border-radius:15px;background:#0e0b1d;overflow:hidden;box-shadow:0 18px 60px #00000035}
.schedule-scroll{overflow-x:auto;overflow-y:hidden}
.schedule{display:grid;grid-template-columns:58px repeat(5,minmax(190px,1fr));min-width:1010px}
.time-rail{background:#0b0917;position:relative}
.stage-head{height:72px;padding:13px 9px 10px;border-left:1px solid #26203a;display:flex;align-items:flex-end;background:#0d0a1b;position:sticky;top:0;z-index:5}
.stage-head span{font-size:13px;line-height:1.05;font-weight:950;text-transform:uppercase;text-align:center;width:100%;letter-spacing:-.02em;text-shadow:0 0 13px currentColor}
.stage-head.k{color:#ffd84a} .stage-head.c{color:#4cdfff} .stage-head.s{color:#ff4bb6} .stage-head.b{color:#8cff2d} .stage-head.a{color:#b28cff}
.time-body,.stage-body{height:900px;position:relative;background-color:#15132d;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#302b49 calc(var(--hour) - 1px),#302b49 var(--hour))}
.time-body{background-color:#0e0c1d;border-right:1px solid #26203a}
.time-label{height:var(--hour);position:relative;padding-top:7px;text-align:right;padding-right:8px;color:#9b95b5;font-size:11px;font-weight:750}
.time-label::after{content:"";position:absolute;right:0;top:0;width:7px;border-top:1px solid #3a3352}
.stage-body{border-left:1px solid #2c2642;background-image:linear-gradient(to bottom,#27223d 1px,transparent 1px),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#39324f calc(var(--hour) - 1px),#39324f var(--hour));background-size:100% 30px,100% var(--hour)}
.stage-body::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0 24.5%,#ffffff06 24.5% 25%,transparent 25% 49.5%,#ffffff06 49.5% 50%,transparent 50% 74.5%,#ffffff06 74.5% 75%,transparent 75%);pointer-events:none}
.show{position:absolute;left:4px;right:4px;padding:8px 8px 7px;border:1px solid #3b3155;border-radius:8px;background:linear-gradient(135deg,#1b1937,#17142e);overflow:hidden;cursor:pointer;transition:.15s ease;z-index:2;box-shadow:0 3px 9px #00000020}
.show:hover{transform:translateY(-1px);border-color:#7b68a0;z-index:4}
.show.selected{border-color:#ff42ae;box-shadow:0 0 0 1px #ff42ae33,0 5px 16px #ff299c22;background:linear-gradient(135deg,#321633,#24152f)}
.show.faded{opacity:.22}
.show-time{font-size:9px;color:#a9a2c0;line-height:1.05;margin-bottom:6px;font-weight:700}
.show-artist{font-size:12px;line-height:1.05;font-weight:950;letter-spacing:-.025em;word-break:break-word}
.show-stage{font-size:9px;color:#938ba9;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{position:absolute;right:5px;top:4px;border:0;background:transparent;padding:1px 2px;font-size:15px;line-height:1;color:#817896;z-index:3}
.star.on{color:#ffe05a;text-shadow:0 0 9px #ffd83a88}
.show.starred{border-color:#6e5b8b}
.empty{padding:30px;text-align:center;color:var(--muted)}
.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 2px 0;color:var(--muted);font-size:10px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

.selected{margin-top:18px;border:1px solid #3c2c54;border-radius:15px;background:linear-gradient(120deg,#17122b,#100d20);padding:15px}
.selected-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:10px}
.selected h2{font-size:18px;margin:0}
.selected-count{color:var(--pink);font-weight:900}
.selected-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid #3b3150;background:#1a1530;border-radius:10px;padding:9px 10px;min-width:170px}
.chip b{display:block;font-size:12px}
.chip small{display:block;color:var(--muted);margin-top:4px;font-size:10px}
.chip button{margin-top:7px;border:0;background:transparent;color:#ff8fce;font-size:10px;padding:0}
.empty-selected{color:var(--muted);font-size:12px;padding:8px 2px}

.modal{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.shade{position:absolute;inset:0;background:#05020ddd;backdrop-filter:blur(7px)}
.sheet{position:relative;z-index:1;width:min(100%,480px);max-height:88vh;overflow:auto;border:1px solid #64477f;border-radius:20px;padding:21px;background:#160f29;box-shadow:0 24px 90px #000}
.x{float:right;border:0;background:transparent;font-size:24px;padding:0 5px;color:#bdb2d1}
.pill{display:inline-block;border:1px solid #654878;border-radius:999px;padding:4px 8px;color:var(--cyan);font-size:9px;letter-spacing:.1em}
.sheet h2{margin:13px 0 6px}
.meta{color:var(--muted);font-size:12px}
.detail-actions{display:flex;gap:7px;margin-top:18px}
.detail-actions button{flex:1;border:1px solid var(--line);background:#211736;border-radius:10px;padding:10px}
.detail-actions .primary{background:linear-gradient(110deg,#a92a96,#6448dd);border-color:transparent}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:15px}
@media(max-width:700px){.app{padding:11px}.top{align-items:flex-start}.title{font-size:14px}.sub{font-size:9px}.stage-head{height:64px;padding-top:10px}.stage-head span{font-size:11px}.schedule{grid-template-columns:48px repeat(5,175px);min-width:923px}.time-label{font-size:9px;padding-right:6px}.show{padding:7px 6px}.show-artist{font-size:11px}}
</style>
</head>

0:45"},{"id":77,"date":"2026-10-04","stage":"Circuit Grounds","artist":"NICO MORENO","start":"00:25","end":"01:40"},{"id":78,"date":"2026-10-04","stage":"Kinetic Field","artist":"FISHER","start":"00:30","end":"01:45"},{"id":79,"date":"2026-10-04","stage":"Bionic Jungle","artist":"LILLY PALMER","start":"00:30","end":"01:45"},{"id":80,"date":"2026-10-04","stage":"BoomBox ART CAR","artist":"PONGPONG","start":"00:30","end":"01:45"},{"id":81,"date":"2026-10-04","stage":"Stereo Bloom","artist":"VINI VICI","start":"00:45","end":"01:45"},{"id":82,"date":"2026-10-04","stage":"Kinetic Field","artist":"TIËSTO","start":"01:45","end":"03:00"},{"id":83,"date":"2026-10-04","stage":"Circuit Grounds","artist":"WOOLI","start":"01:45","end":"03:00"},{"id":84,"date":"2026-10-04","stage":"Stereo Bloom","artist":"NIFRA","start":"01:45","end":"03:00"},{"id":85,"date":"2026-10-04","stage":"Bionic Jungle","artist":"999999999","start":"01:45","end":"03:00"},{"id":86,"date":"2026-10-04","stage":"BoomBox ART CAR","artist":"KIANN","start":"01:45","end":"03:00"}];
const STAGES=['Kinetic Field','Circuit Grounds','Stereo Bloom','Bionic Jungle','BoomBox ART CAR'];
const START_MIN=17*60, END_MIN=27*60, PX_PER_MIN=1.5;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let date='2026-10-03', stage='전체', mine=false, query='', activeId=null;
let selected=new Set(), fav=new Set();
try{selected=new Set(JSON.parse(localStorage.getItem('edc26-selected')||'[]').map(String))}catch(e){}
try{fav=new Set(JSON.parse(localStorage.getItem('edc26-favorites')||'[]').map(String))}catch(e){}
const mins=t=>{let [h,m]=t.split(':').map(Number); if(h<5)h+=24; return h*60+m};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
function persist(){try{localStorage.setItem('edc26-selected',JSON.stringify([...selected]));localStorage.setItem('edc26-favorites',JSON.stringify([...fav]))}catch(e){}}
function filtered(){return SHOWS.filter(x=>x.date===date&&(stage==='전체'||x.stage===stage)&&(!mine||fav.has(String(x.id)))&&(!query||x.artist.toLowerCase().includes(query.toLowerCase())))}
function renderTime(){
  let h='';
  for(let m=START_MIN;m<=END_MIN;m+=60){const hh=Math.floor(m/60)%24;const label=String(hh).padStart(2,'0')+':00';h+=`<div class="time-label">${label}</div>`}
  $('#timeBody').innerHTML=h;
}
function makeBlock(x){
  const top=(mins(x.start)-START_MIN)*PX_PER_MIN;
  const height=Math.max((mins(x.end)-mins(x.start))*PX_PER_MIN-4,42);
  const isSel=selected.has(String(x.id)), isFav=fav.has(String(x.id));
  const cls=['show',isSel?'selected':'',isFav?'starred':''].filter(Boolean).join(' ');
  return `<article class="${cls}" data-id="${x.id}" style="top:${top}px;height:${height}px" title="${esc(x.artist)} · ${x.start}-${x.end}">
    <button class="star ${isFav?'on':''}" data-fav="${x.id}" aria-label="즐겨찾기">${isFav?'★':'☆'}</button>
    <div class="show-time">${x.start}<br>–${x.end}</div>
    <div class="show-artist">${esc(x.artist)}</div>
    <div class="show-stage">${esc(x.stage)}</div>
  </article>`;
}
function render(){
  $('#stageFilters').innerHTML='<button class="stage-filter '+(stage==='전체'?'active':'')+'" data-stage="전체">전체</button>'+STAGES.map((s,i)=>`<button class="stage-filter ${stage===s?'active':''}" data-stage="${esc(s)}">${esc(s)}</button>`).join('');
  const data=filtered().sort((a,b)=>mins(a.start)-mins(b.start));
  $('#sets').textContent=data.length; $('#count').textContent=fav.size;
  STAGES.forEach(s=>{const el=$('#stage-'+slug(s)); const items=data.filter(x=>x.stage===s); el.innerHTML=items.map(makeBlock).join('')||'';});
  renderSelected();
}
function renderSelected(){
  const items=SHOWS.filter(x=>selected.has(String(x.id))).sort((a,b)=>a.date.localeCompare(b.date)||mins(a.start)-mins(b.start));
  $('#selectedCount').textContent=items.length;
  $('#selectedList').innerHTML=items.length?items.map(x=>`<div class="chip"><b>${esc(x.artist)}</b><small>${x.date.slice(5).replace('-','/')} · ${x.start}-${x.end} · ${esc(x.stage)}</small><button data-unpick="${x.id}">선택 해제</button></div>`).join(''):'<div class="empty-selected">아직 선택한 공연이 없습니다. 위 타임테이블에서 원하는 공연을 클릭해 보세요.</div>';
}
function toggleSelected(id){id=String(id); selected.has(id)?selected.delete(id):selected.add(id); persist(); render();}
function toggleFav(id){id=String(id); fav.has(id)?fav.delete(id):fav.add(id); persist(); render(); if(activeId!==null)openShow(activeId,false)}
function openShow(id,show=true){
  activeId=Number(id); const x=SHOWS.find(a=>a.id===activeId); if(!x)return;
  $('#mstage').textContent=x.stage; $('#martist').textContent=x.artist; $('#mtime').textContent=`${x.date.slice(5).replace('-','/')} · ${x.start} — ${x.end}`;
  $('#mstatus').textContent=selected.has(String(id))?'내 타임테이블에 선택됨':'선택 안 함';
  $('#mfav').textContent=fav.has(String(id))?'★ 즐겨찾기 해제':'☆ 즐겨찾기';
  $('#mselect').textContent=selected.has(String(id))?'내 타임테이블에서 해제':'내 타임테이블 추가';
  if(show)$('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open')}
function clearAll(){selected.clear();fav.clear();persist();render();}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeModal();return}
  const favBtn=e.target.closest('[data-fav]'); if(favBtn){e.stopPropagation();toggleFav(favBtn.dataset.fav);return}
  const un=e.target.closest('[data-unpick]'); if(un){toggleSelected(un.dataset.unpick);return}
  const stageBtn=e.target.closest('[data-stage]'); if(stageBtn){stage=stageBtn.dataset.stage;render();return}
  const day=e.target.closest('[data-date]'); if(day){date=day.dataset.date;$$('.day').forEach(b=>b.classList.toggle('active',b===day));render();return}
  const card=e.target.closest('[data-id]'); if(card){openShow(card.dataset.id);return}
});
$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});
$('#mine').addEventListener('click',()=>{mine=!mine;$('#mine').classList.toggle('active',mine);render()});
$('#clearAll').addEventListener('click',()=>{if(confirm('선택한 공연과 즐겨찾기를 모두 초기화할까요?'))clearAll()});
$('#mfav').addEventListener('click',()=>{if(activeId!==null)toggleFav(activeId)});
$('#mselect').addEventListener('click',()=>{if(activeId!==null){toggleSelected(activeId);openShow(activeId,false);}});
$('#jumpNow').addEventListener('click',()=>{const el=$('#scheduleScroll');el.scrollTo({left:0,behavior:'smooth'});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderTime();render();
</script>
